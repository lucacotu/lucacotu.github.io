<!DOCTYPE html>
<!-- 
  ====================================================================
  3D INTERACTIVE GALLERY WEBGL APPLICATION
  ====================================================================
  This is an interactive WebGL-based 3D environment that simulates 
  walking through an art gallery. Features include:
  - First-person camera navigation (WASD to move, arrows to rotate)
  - Interactive benches that can be sat on (press E)
  - Textured room with floor, walls, and ceiling
  - Framed artworks displayed on walls
  - A marble statue in the center
  - Dynamic lighting and text-based captions
  - Physics-based lighting with specular highlights
  
  Technologies:
  - WebGL 2.0 for 3D rendering
  - GLSL ES shaders for graphics
  - Matrix math library (m4.js) for transformations
  - OBJ file loader for mesh data
  ====================================================================
-->

<body>
<!-- WebGL Canvas: Main rendering surface for the 3D scene (1200x600px, 16:9 aspect ratio) -->
<canvas id="gl" height="600" width="1200"></canvas>
<div id="loading">
  <div id="loading-text">Loading...</div>
</div>
<!-- Notification div: Displays temporary messages to the user (e.g., "You can't sit here") -->
<div id="notification"></div>

<!-- Touch controls overlay: visible only on touch devices -->
<div id="touch-controls">
  <div id="joystick-zone">
    <div id="joystick-base"></div>
    <div id="joystick-thumb"></div>
  </div>
  <div id="look-zone"></div>
  <div id="interact-btn">E</div>
  <div id="menu-btn">⚙</div>

<!-- ===== SHADER PROGRAMS ===== -->
<!-- 
  VERTEX SHADER FOR 3D OBJECTS
  Processes each vertex of meshes (frames, statue, benches, etc.)
  Responsibilities:
  - Transform vertex position from model space to clip space
  - Calculate normal vectors for lighting calculations
  - Pass texture coordinates to fragment shader
-->
<script id="vertex-shader-obj" type="x-shader/x-vertex">#version 300 es
precision highp float;

// ===== INPUT VERTEX ATTRIBUTES =====
in vec3 a_position;   /* 3D position of the vertex in model space */
in vec3 a_normal;     /* Normal vector for lighting calculations */
in vec2 a_texcoord;   /* 2D texture coordinates (UV mapping) */

// ===== UNIFORMS (same for all vertices in a single draw call) =====
uniform mat4 u_world;      /* Model-to-world space transformation matrix */
uniform mat4 u_view;       /* World-to-view space transformation matrix */
uniform mat4 u_proj;       /* View-to-clip space projection matrix */
uniform mat3 u_normalMatrix; /* Transforms normals to world space (inverse transpose of u_world) */

// ===== OUTPUT TO FRAGMENT SHADER =====
out vec3 v_normal;     /* Normal vector in world space */
out vec3 v_position;   /* Vertex position in world space */
out vec2 v_texcoord;   /* Texture coordinates passed through */

// [OLD - 2D shadow map] uniform mat4 u_lightSpaceMatrix;
// [OLD - 2D shadow map] out vec4 v_posLightSpace;

void main() {
    /* Transform normal to world space for per-fragment lighting */
    v_normal = normalize(u_normalMatrix * a_normal);
    /* Pass texture coordinates unchanged */
    v_texcoord = a_texcoord;

    /* Transform vertex position to world space and store for lighting */
    vec4 worldPos = u_world * vec4(a_position, 1.0);
    v_position = worldPos.xyz;

    /* Final transformation: model space -> world -> view -> clip space */
    gl_Position = u_proj * u_view * worldPos;
    // [OLD - 2D shadow map] v_posLightSpace = u_lightSpaceMatrix * worldPos;
}
</script>
<!-- 
  FRAGMENT SHADER FOR 3D OBJECTS
  Calculates the final color for each pixel using:
  - Phong lighting model (diffuse + specular + ambient)
  - Optional texture mapping
  - Multiple light sources with distance attenuation
-->
<script id="fragment-shader-obj" type="x-shader/x-fragment">#version 300 es
precision mediump float;

/* Maximum number of light sources supported */
#define NUM_LIGHTS 2

/* Light source data structure */
struct Light {
    vec3 position;   /* Position of the light in world space */
    vec3 color;      /* RGB color of the light */
    float intensity; /* Brightness multiplier */
};

// ===== INPUT UNIFORMS =====
uniform Light u_lights[NUM_LIGHTS];     /* Array of light sources */
uniform vec3 u_viewPos;                 /* Camera position in world space */
uniform vec3 u_objectColor;             /* Base color of the object */
uniform int u_ignoreLight;              /* Flag: 0 = apply lighting, 1 = unlit */
uniform sampler2D u_texture;            /* Texture sampler for 2D texture mapping */
uniform bool u_useTexture;   /* Flag: true = use texture, false = use solid color */

// [OLD - 2D shadow map] uniform sampler2D u_shadowMap;
// [OLD - 2D shadow map] uniform mat4 u_lightSpaceMatrix;

/* NUOVO: cubemap per ombre omnidirezionali (una per luce) */
uniform samplerCube u_shadowCube;
uniform samplerCube u_shadowCube1;
uniform float u_farPlane;
uniform bool u_useShadows;

// ===== INPUT FROM VERTEX SHADER =====
in vec3 v_normal;     /* Normal vector at this fragment */
in vec3 v_position;   /* Position at this fragment in world space */
in vec2 v_texcoord;   /* Texture coordinates at this fragment */

// [OLD - 2D shadow map] in vec4 v_posLightSpace;

// ===== OUTPUT =====
out vec4 fragColor;   /* Final RGBA color of this pixel */

/* [OLD - 2D shadow map]
float shadowCalculation(vec4 posLightSpace) {
    vec3 projCoords = posLightSpace.xyz / posLightSpace.w;
    projCoords = projCoords * 0.5 + 0.5;
    if (projCoords.z > 1.0 || projCoords.x < 0.0 || projCoords.x > 1.0
        || projCoords.y < 0.0 || projCoords.y > 1.0 || projCoords.z < 0.0)
        return 0.0;
    float closestDepth = texture(u_shadowMap, projCoords.xy).r;
    float currentDepth = projCoords.z;
    vec3 norm = normalize(v_normal);
    vec3 lightDir = normalize(u_lights[0].position - v_position);
    float bias = max(0.005 * (1.0 - dot(norm, lightDir)), 0.0002);
    float shadow = 0.0;
    vec2 texelSize = 1.0 / vec2(textureSize(u_shadowMap, 0));
    for (int x = -1; x <= 1; x++) {
        for (int y = -1; y <= 1; y++) {
            float pcfDepth = texture(u_shadowMap, projCoords.xy + vec2(x, y) * texelSize).r;
            shadow += currentDepth - bias > pcfDepth ? 1.0 : 0.0;
        }
    }
    shadow /= 9.0;
    return shadow;
}
*/

/* [OLD - PCF con offset world-space fissi, produce ghost copies di ombra]
float shadowCalculation() {
    vec3 fragToLight = v_position - u_lights[0].position;
    float currentDepth = length(fragToLight);
    float bias = 0.1;
    vec3 sampleOffsetDirections[20] = vec3[](
        vec3( 1,  1,  1), vec3( 1, -1,  1), vec3(-1, -1,  1), vec3(-1,  1,  1),
        vec3( 1,  1, -1), vec3( 1, -1, -1), vec3(-1, -1, -1), vec3(-1,  1, -1),
        vec3( 1,  1,  0), vec3( 1, -1,  0), vec3(-1, -1,  0), vec3(-1,  1,  0),
        vec3( 1,  0,  1), vec3(-1,  0,  1), vec3( 1,  0, -1), vec3(-1,  0, -1),
        vec3( 0,  1,  1), vec3( 0, -1,  1), vec3( 0, -1, -1), vec3( 0,  1, -1)
    );
    float shadow = 0.0;
    float diskRadius = 0.03;
    for (int i = 0; i < 20; i++) {
        float closestDepth = texture(u_shadowCube, fragToLight + sampleOffsetDirections[i] * diskRadius).r * u_farPlane;
        if (currentDepth - bias > closestDepth) shadow += 1.0;
    }
    return shadow / 20.0;
}
*/

/* [OLD - PCF nel piano perpendicolare a fragToLight]
float shadowCalculation() {
    vec3 fragToLight = v_position - u_lights[0].position;
    float currentDepth = length(fragToLight);
    float bias = 0.1;
    vec3 f     = normalize(fragToLight);
    vec3 up    = abs(f.y) < 0.999 ? vec3(0.0, 1.0, 0.0) : vec3(1.0, 0.0, 0.0);
    vec3 right = normalize(cross(up, f));
    vec3 tang  = cross(f, right);
    float shadow = 0.0;
    float diskRadius = 0.10;
    for (int x = -1; x <= 1; x++) {
        for (int y = -1; y <= 1; y++) {
            vec3 sampleDir = fragToLight
                + right * float(x) * diskRadius
                + tang  * float(y) * diskRadius;
            float closestDepth = texture(u_shadowCube, sampleDir).r * u_farPlane;
            if (currentDepth - bias > closestDepth) shadow += 1.0;
        }
    }
    return shadow / 9.0;
}
*/

/* Single sample — campiona la cubemap corrispondente all'indice luce */
float shadowCalculation(int lightIndex) {
    if (!u_useShadows) return 0.0;
    vec3 fragToLight;
    float closestDepth;
    if (lightIndex == 0) {
        fragToLight  = v_position - u_lights[0].position;
        closestDepth = texture(u_shadowCube,  fragToLight).r * u_farPlane;
    } else {
        fragToLight  = v_position - u_lights[1].position;
        closestDepth = texture(u_shadowCube1, fragToLight).r * u_farPlane;
    }
    float currentDepth = length(fragToLight);
    float bias = 0.02;
    return currentDepth - bias > closestDepth ? 1.0 : 0.0;
}

void main() {
    /* Determine base color: either from texture or solid object color */
    vec3 baseColor = u_useTexture ? texture(u_texture, v_texcoord).rgb : u_objectColor;

    /* If lighting is disabled, simply output the base color */
    if (u_ignoreLight == 1) {
        fragColor = vec4(baseColor, 1.0);
        return;
    }

    /* ===== PHONG LIGHTING CALCULATION ===== */
    vec3 norm = normalize(v_normal);                    /* Normalize the surface normal */
    vec3 viewDir = normalize(u_viewPos - v_position);  /* Direction from surface to camera */
    vec3 result = vec3(0.0);                            /* Accumulator for final lighting */

        for (int i = 0; i < NUM_LIGHTS; i++) {
        vec3 lightDir = normalize(u_lights[i].position - v_position);
        float diff = max(dot(norm, lightDir), 0.0);
        vec3 reflectDir = reflect(-lightDir, norm);
        float spec = pow(max(dot(viewDir, reflectDir), 0.0), 32.0);
        float distance = length(u_lights[i].position - v_position);
        float attenuation = 1.0 / (1.0 + 0.14 * distance + 0.07 * distance * distance);
        float specStrength = 0.3;

        vec3 diffuse  = diff * u_lights[i].color * u_lights[i].intensity * attenuation;
        vec3 specular = specStrength * spec * u_lights[i].color * u_lights[i].intensity * attenuation;

        /* NUOVO: moltiplica diffuse e specular per (1 - shadow) */
        // [OLD - 2D shadow map] float shadow = shadowCalculation(v_posLightSpace);
        float shadow = shadowCalculation(i);
        result += (1.0 - shadow) * (diffuse + specular);
    }

    /* Multiply lighting by base color (color-dependent shading) */
    result *= baseColor;

    /* Add ambient light: minimal light everywhere (shadows not pure black) */
    result += 0.10 * baseColor;

    //float debugDepth = texture(u_shadowMap, v_posLightSpace.xy / v_posLightSpace.w * 0.5 + 0.5).r;
    //fragColor = vec4(debugDepth, 0.0, 0.0, 1.0);
    fragColor = vec4(result, 1.0);
}
</script>
<!-- 
  VERTEX SHADER FOR 2D TEXT RENDERING
  Used for caption plaques - renders simple 2D quad in 3D space
-->
<script id="vertex-shader-text" type="x-shader/x-vertex">#version 300 es
precision highp float;

/* 2D position + texture coordinate setup */
in vec4 a_position;   /* 2D position of text quad */
in vec2 a_texcoord;   /* Texture coordinates for text image */

/* Matrix for positioning text in world space */
uniform mat4 u_matrix;

/* Pass texture coordinates to fragment shader */
out vec2 v_texcoord;

void main() {
    gl_Position = u_matrix * a_position;
    v_texcoord = a_texcoord;
}
</script>

<!-- 
  FRAGMENT SHADER FOR 2D TEXT RENDERING
  Simply outputs the texture (text already rendered to texture in JavaScript)
-->
<script id="fragment-shader-text" type="x-shader/x-fragment">#version 300 es
precision highp float;

in vec2 v_texcoord;
uniform sampler2D u_texture;  /* Texture containing rendered text */

out vec4 outColor;

void main() {
    /* Output the text texture directly */
    outColor = texture(u_texture, v_texcoord);
}
</script>
<!-- 
  VERTEX SHADER FOR SHADOW/DEPTH RENDERING
  Used for rendering depth from light source perspective
  (Currently unused but available for shadow mapping implementation)
-->
<script id="vertex-shader-light" type="x-shader/x-vertex">#version 300 es
layout (location=0) in vec3 a_position;

uniform mat4 u_lightSpaceMatrix;
uniform mat4 u_model;

/* NUOVO: posizione world-space necessaria per calcolare la distanza nel fragment shader */
out vec3 v_fragPos;

void main(){
  vec4 worldPos = u_model * vec4(a_position, 1.0);
  v_fragPos = worldPos.xyz;
  gl_Position = u_lightSpaceMatrix * worldPos;
}
</script>

<!-- 
  FRAGMENT SHADER FOR SHADOW/DEPTH RENDERING
  Empty fragment shader - only depth buffer is written to
  (Depth is automatically stored by gl.DEPTH_TEST)
-->
<script id="fragment-shader-light" type="x-shader/x-fragment">#version 300 es
precision highp float;

/* NUOVO: riceve la posizione world-space dal vertex shader */
in vec3 v_fragPos;
uniform vec3 u_lightPos;
uniform float u_farPlane;

/* Scrive la distanza normalizzata nel canale rosso della cubemap */
out vec4 fragColor;

void main() {
    float lightDistance = length(v_fragPos - u_lightPos) / u_farPlane;
    fragColor = vec4(lightDistance, 0.0, 0.0, 1.0);
}
</script>


<script>

/* ====================================================================
   3D GALLERY APPLICATION - JAVASCRIPT CODE
   ====================================================================
   Main application logic for WebGL-based art gallery using First-Person
   camera perspective, interactive elements, and physically-based lighting.
   ==================================================================== */

// ==================== NOTIFICATION SYSTEM ====================
/**
 * Displays a temporary notification message in the center of the screen
 * @param {string} text - The message to display
 * @param {number} duration - How long to show the message in milliseconds (default: 3000)
 * 
 * Example: showNotification("You can't sit here", 2000)
 */
let notifTimeout;

function showNotification(text, duration = 3000) {
  const notif = document.getElementById("notification");
  clearTimeout(notifTimeout);  /* Cancel previous timeout if notification is already showing */
  notif.innerText = text;      /* Set the notification text */
  notif.style.opacity = "1";   /* Make it visible (CSS transition handles fade in) */
  /* Schedule the notification to fade out after duration */
  notifTimeout = setTimeout(() => {
    notif.style.opacity = "0";
  }, duration);
}

// Risorse da attendere: 8 texture + 4 mesh = 12
let resourcesToLoad = 12;

function onResourceLoaded() {
  resourcesToLoad--;
  document.getElementById("loading-text").innerText = 
    `Loading... ${12 - resourcesToLoad}/12`;
  if (resourcesToLoad <= 0) {
    document.getElementById("loading").style.display = "none";
    showNotification("Press E to sit down and stand up", 2000);
    draw(); 
  }
}

// ==================== UTILITY FUNCTIONS ====================

/**
 * Creates a Vertex Buffer Object (VBO) - GPU memory for vertex data
 * @param {number[]} data - Array of vertex attribute values
 * @returns {WebGLBuffer} The created buffer object
 * 
 * VBOs are used to store large amounts of geometry data on the GPU
 * for efficient rendering of meshes and room geometry
 */
function makeVBO(data) {
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(data), gl.STATIC_DRAW);
  return buf;
}

/**
 * Checks if a number is a power of 2 (2, 4, 8, 16, 32, 64, 128, 256, 512, 1024...)
 * @param {number} value - The number to check
 * @returns {boolean} True if the number is a power of 2
 * 
 * Used for texture validation: GPU mipmapping works efficiently with power-of-2 dimensions
 */
function isPowerOf2(value) {
  return (value & (value - 1)) == 0;
}

/**
 * Creates a simple 2D plane geometry (for caption plaques)
 * Used to display text on planes in the 3D scene
 * @param {WebGLRenderingContext} gl - The WebGL context
 * @returns {object} Object containing position, texcoord, normal VBO buffers
 * 
 * The plane is a 2x1 quad (2 units wide, 1 unit tall) in XY plane facing +Z
 */
function createPlane(gl) {
  /* ===== PLANE VERTICES ===== */
  const positions = new Float32Array([
    -1, -0.5, 0,  /* Bottom-left */
     1, -0.5, 0,  /* Bottom-right */
    -1,  0.5, 0,  /* Top-left */
     1,  0.5, 0,  /* Top-right */
  ]);
  
  /* ===== TEXTURE COORDINATES ===== */
  const texcoords = new Float32Array([
    0, 1,  /* Bottom-left UV */
    1, 1,  /* Bottom-right UV */
    0, 0,  /* Top-left UV */
    1, 0,  /* Top-right UV */
  ]);
  
  /* ===== SURFACE NORMALS ===== */
  const normals = new Float32Array([
    0, 0, 1,  /* All vertices point towards +Z (facing camera) */
    0, 0, 1, 
    0, 0, 1, 
    0, 0, 1
  ]);

  /* Create and upload vertex attribute buffers */
  const positionBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, positionBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, positions, gl.STATIC_DRAW);

  const texcoordBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, texcoordBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, texcoords, gl.STATIC_DRAW);

  const normalBuffer = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, normalBuffer);
  gl.bufferData(gl.ARRAY_BUFFER, normals, gl.STATIC_DRAW);

  return {
    position: positionBuffer,
    texcoord: texcoordBuffer,
    normal: normalBuffer,
    numVertices: 4
  };
}

/**
 * Computes and uploads the normal matrix to the shader
 * The normal matrix is the inverse transpose of the model matrix
 * Used to transform surface normals correctly (especially with non-uniform scaling)
 * @param {mat4} world - The model-to-world transformation matrix
 */
function setNormalMatrix(world) {
  const it = m4.transpose(m4.inverse(world));
  gl.uniformMatrix3fv(
    u_normalMatrix,
    false,
    new Float32Array([
      it[0], it[1], it[2],
      it[4], it[5], it[6],
      it[8], it[9], it[10],
    ])
  );
}

/**
 * Computes the transformation matrix from light source's perspective
 * Used for shadow mapping (currently implemented but disabled)
 * @param {number[]} lightPos - Light position [x, y, z]
 * @param {number[]} target - Point to look at (default: origin [0,0,0])
 * @returns {mat4} Combined projection * view matrix from light's viewpoint
 */
function computeLightMatrix(lightPos, target=[0,0,0]) {
  const lightView = m4.lookAt(lightPos, target, [0,1,0]);
  const lightProj = m4.perspective(Math.PI/2, 1.0, 0.1, 30.0);
  return m4.multiply(lightProj, lightView);
}

// ==================== TEXTURE LOADING ====================

/**
 * Loads an image file as a WebGL texture
 * Handles asynchronous image loading and GPU texture setup
 * @param {WebGLRenderingContext} gl - The WebGL context
 * @param {string} path - Path to the image file (e.g., "")
 * @param {string} fileName - Name of the image file (e.g., "wood_floor.jpg")
 * @returns {WebGLTexture} The created texture object
 * 
 * Features:
 * - Creates white placeholder texture while image loads
 * - Applies mipmapping for efficient far-field rendering
 * - Handles non-power-of-2 textures with clamp-to-edge
 */
function loadTexture(gl, path, fileName) {
  /* Create a new texture and bind it */
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);

  /* Create white placeholder texture (1x1 pixel, RGBA) */
  const level = 0;
  const internalFormat = gl.RGBA;
  const pixel = new Uint8Array([255, 255, 255, 255]);
  gl.texImage2D(gl.TEXTURE_2D, level, internalFormat, 1, 1, 0, gl.RGBA, gl.UNSIGNED_BYTE, pixel);
  
  if(fileName){
    /* Load image asynchronously */
    const img = new Image();
    img.onload = () => {
      gl.bindTexture(gl.TEXTURE_2D, texture);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
      
      /* If image dimensions are power-of-2, enable mipmapping for better performance */
      if (isPowerOf2(img.width) && isPowerOf2(img.height)) {
        gl.generateMipmap(gl.TEXTURE_2D);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.REPEAT);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.REPEAT);
      } else {
        /* For non-power-of-2 textures, use CLAMP_TO_EDGE to avoid artifacts */
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
      }
      onResourceLoaded();  /* Notify that a resource has finished loading */  
    };
    img.src = path + fileName;
  }
  return texture;
}

/**
 * Creates a texture from text rendered on an HTML5 canvas
 * Used for captions and plaques displayed in the gallery
 * @param {WebGLRenderingContext} gl - The WebGL context
 * @param {string} text - The text to render (supports multi-line with \n)
 * @returns {WebGLTexture} Texture containing rendered text
 * 
 * Process:
 * 1. Create a 512x128 canvas (landscape oriented for text)
 * 2. Draw white background with black border
 * 3. Render text in black, centered
 * 4. Upload canvas as texture
 */
function createTextTexture(gl, text) {
  /* Create a canvas to render text onto */
  const canvas = document.createElement("canvas");
  const ctx = canvas.getContext("2d");

  /* Set canvas size: 512 pixels wide, 128 pixels tall (4:1 aspect ratio for text) */
  canvas.width = 512;
  canvas.height = 128;

  /* Draw white background */
  ctx.fillStyle = "white";
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  
  /* Draw black border around the text area */
  ctx.strokeStyle = "black";
  ctx.lineWidth = 4;
  ctx.strokeRect(0, 0, canvas.width, canvas.height);

  /* Setup text rendering */
  ctx.fillStyle = "black";
  ctx.font = "bold 28px Arial";
  ctx.textAlign = "center";  /* Center text horizontally */
  ctx.textBaseline = "middle"; /* Center text vertically */
  
  /* Handle multi-line text (split by newline) */
  const lines = text.split("\n");
  const lineHeight = 34;
  const startY = canvas.height / 2 - ((lines.length - 1) * lineHeight) / 2;

  /* Draw each line of text */
  lines.forEach((line, i) => {
    ctx.fillText(line, canvas.width / 2, startY + i * lineHeight);
  });

  /* Convert canvas to WebGL texture */
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, canvas);
  
  /* Setup texture parameters for non-power-of-2 canvas */
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);

  return texture;
}

/**
 * Loads OBJ mesh data from file and creates GPU buffers for rendering
 * Handles multi-part meshes (different parts can have different materials)
 * @param {WebGLRenderingContext} gl - The WebGL context
 * @param {object} meshObj - The mesh object loaded from OBJ file
 * @param {object} meshDef - Mesh definition with id and properties
 * 
 * The LoadMesh function (from load_mesh.js) handles async OBJ loading
 * We then convert the loaded mesh parts into GPU-friendly VBOs
 */
function loadMeshData(gl, meshObj, meshDef) {
  LoadMesh(gl, meshObj, () => {
    /* Initialize storage arrays for each mesh part's buffers */
    positionBuf[meshDef.id] = [];
    normalBuf[meshDef.id] = []; 
    texcoordBuf[meshDef.id] = [];
    numVertices[meshDef.id] = [];
    
    /* Upload each mesh part to GPU */
    gl.useProgram(progObj);
    for (let i = 0; i < meshObj.part.length; i++) {
      /* Convert position data to VBO and store in array */
      positionBuf[meshDef.id][i] = makeVBO(meshObj.part[i].positions);
      /* Convert normal data to VBO */
      normalBuf[meshDef.id][i] = makeVBO(meshObj.part[i].normals);
      /* Convert texture coordinate data to VBO */
      texcoordBuf[meshDef.id][i] = makeVBO(meshObj.part[i].texcoords);
      /* Store vertex count for rendering */
      numVertices[meshDef.id][i] = meshObj.part[i].positions.length / 3;
    }
  onResourceLoaded();
  });
}

// ==================== BUFFER SETUP ====================

/**
 * Configures vertex attribute pointers for a set of geometry
 * Maps GPU memory to shader variables
 * @param {number} posLoc - Shader attribute location for position
 * @param {number} normalLoc - Shader attribute location for normale
 * @param {number} texcoordLoc - Shader attribute location for texture coordinates
 * @param {WebGLBuffer} posBuffer - GPU buffer containing position data
 * @param {WebGLBuffer} normBuffer - GPU buffer containing normal data
 * @param {WebGLBuffer} texBuffer - GPU buffer containing texture coordinate data
 * @param {boolean} isDepthPass - If true, skip setting up normals/texcoords (depth pass only needs position)
 * 
 * This must be called before any gl.drawArrays() to tell the GPU where to find vertex data
 */
function setupVertexAttribPointers(posLoc, normalLoc, texcoordLoc, posBuffer, normBuffer, texBuffer, isDepthPass) {
  /* Setup position attribute pointer */
  gl.bindBuffer(gl.ARRAY_BUFFER, posBuffer);
  gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);  /* 3 floats per position */
  gl.enableVertexAttribArray(posLoc);

  /* Only setup normals and texcoords for non-depth passes (to save bandwidth) */
  if (!isDepthPass) {
    /* Setup normal attribute pointer */
    gl.bindBuffer(gl.ARRAY_BUFFER, normBuffer);
    gl.vertexAttribPointer(normalLoc, 3, gl.FLOAT, false, 0, 0);  /* 3 floats per normal */
    gl.enableVertexAttribArray(normalLoc);

    /* Setup texture coordinate attribute pointer */
    gl.bindBuffer(gl.ARRAY_BUFFER, texBuffer);
    gl.vertexAttribPointer(texcoordLoc, 2, gl.FLOAT, false, 0, 0);  /* 2 floats per texcoord */
    gl.enableVertexAttribArray(texcoordLoc);
  }
}

/**
 * Sets all material properties and texture uniforms for rendering an object
 * @param {WebGLTexture} texture - The texture to apply
 * @param {number} ignoreLight - 1 = unlit object, 0 = apply lighting
 * @param {number} useTexture - 1 = use texture color, 0 = use solid color
 * @param {number[]} objectColor - RGB color [r, g, b] if useTexture == 0
 */
function setObjectUniforms(texture, ignoreLight, useTexture, objectColor) {
  gl.activeTexture(gl.TEXTURE0);
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.uniform1i(textureLocation, 0);  /* Tell shader to sample from texture unit 0 */
  gl.uniform1i(u_ignoreLight, ignoreLight);
  gl.uniform1i(u_useTexture, useTexture);
  gl.uniform3fv(u_objectColor, objectColor);
}

/**
 * Creates Vertex Buffer Objects for all room geometry (floor, ceiling, walls)
 * Organizes geometry data into a convenient object structure
 * @returns {object} Object with floor, ceil, and walls containing their buffers and vertex counts
 */
function setupRoomGeometry() {
  const geometries = {
    floor: {
      positions: floor,
      normals: floorNormals,
      texcoords: floorText,
      buffers: {}
    },
    ceil: {
      positions: ceil,
      normals: ceilNormals,
      texcoords: ceilText,
      buffers: {}
    },
    walls: {
      positions: [...wallN, ...wallS, ...wallE, ...wallW],
      normals: wallNormals,
      texcoords: [...wallText, ...wallText, ...wallText, ...wallText],
      buffers: {}
    }
  };

  /* Convert each geometry's vertex data to GPU buffers */
  for (let key in geometries) {
    const geom = geometries[key];
    geom.buffers.position = makeVBO(geom.positions);
    geom.buffers.normal = makeVBO(geom.normals);
    geom.buffers.texcoord = makeVBO(geom.texcoords);
    geom.buffers.vertexCount = geom.positions.length / 3;  /* Each vertex is 3 floats */
  }

  return geometries;
}

/**
 * Checks if the player can sit on a bench at their current position
 * Defines sitting zones as rectangular areas in front of benches
 * @returns {boolean} True if player is in a valid sitting zone
 */
function canSit() {
  const x = camPos[0];
  const z = camPos[2];

  /* Define valid sitting zones (X coordinate ranges for each bench) */
  const benches = [
    { x: [3.5, 6.5] },   /* Right bench */
    { x: [-6.5, -3.5] }, /* Left bench */
    { x: [-1.5, 1.5] }   /* Center bench */
  ];

  /* Check if player is in the sitting area (Z between -1 and 1) and near a bench */
  if (z >= -1 && z <= 1) {
    for (let bench of benches) {
      if (x >= bench.x[0] && x <= bench.x[1]) {
        return true;
      }
    }
  }

  showNotification("You can't sit here", 2000);
  return false;
}

/**
 * Handles keyboard input for camera movement and interaction
 * Implements first-person movement with WASD keys and arrow key rotation
 * E key toggles sitting position
 * @param {KeyboardEvent} e - The keyboard event
 * 
 * Controls:
 * - W/A/S/D: Move forward/left/backward/right (only when standing)
 * - Arrow Left/Right: Rotate camera yaw (works while sitting or standing)
 * - E: Toggle sit/stand position
 */
function handleCameraMovement(e) {
  if (e.key === 'm' || e.key === 'M') {
    menuOpen = !menuOpen;
    if (gui) gui.domElement.style.display = menuOpen ? '' : 'none';
    return;
  }
  if (menuOpen) return;
  const spd = 0.2;  /* Movement speed multiplier */
  
  /* Calculate directional vectors based on camera yaw */
  const forward = [Math.sin(yaw), 0, -Math.cos(yaw)];      /* Direction camera is facing */
  const right = [Math.cos(yaw), 0, Math.sin(yaw)];         /* Right side relative to camera */

  /* Movement is only allowed when standing */
  if (sit == false && (e.key == "w" || e.key == "W")) {
    camPos = camPos.map((v, i) => v + forward[i] * spd);
  }
  if (sit == false && (e.key == "s" || e.key == "S")) {
    camPos = camPos.map((v, i) => v - forward[i] * spd);
  }
  if (sit == false && (e.key == "a" || e.key == 'A')) {
    camPos = camPos.map((v, i) => v - right[i] * spd);
  }
  if (sit == false && (e.key == "d" || e.key == "D")) {
    camPos = camPos.map((v, i) => v + right[i] * spd);
  }
  
  /* Camera rotation is allowed while sitting or standing */
  if (e.key == "ArrowLeft") yaw -= 0.05;
  if (e.key == "ArrowRight") yaw += 0.05;
  
  /* Toggle sit/stand with E key */
  if (e.key == "E" || e.key == "e") {
    if (sit) { 
      /* Standing up from bench */
      sit = !sit;
      camPos[1] = 1.6;  /* Eye height when standing */
      if (first) {
        first = !first;
        showNotification("Use WASD and the arrow keys to move", 2000);
      }
    } else {
      /* Attempting to sit on a bench */
      if (canSit()) {
        sit = !sit;
        /* Adjust camera orientation to face desired direction */
        if (camPos[2] < 0) yaw = 0;      /* Face +X if on north bench */
        else yaw = Math.PI;              /* Face -X if on south bench */
        camPos[1] = 1;                   /* Eye height when sitting */
        camPos[2] = 0;                   /* Fix Z position to bench center */
      }
    }
  }
  
  /* Clamp camera position to room boundaries (prevent walking through walls) */
  camPos = camPos.map((v, i) => Math.min(Math.max(v, roomMin[i]), roomMax[i]));
}

/**
 * Renders a single part of the room (floor, ceiling, or wall) with texture
 * Handles all vertex buffer setup, material properties, and transformation
 * @param {object} buffers - Contains position, normal, texcoord VBOs and vertex count
 * @param {WebGLTexture} texture - The texture to apply
 * @param {string} partName - Name of the room part (for debugging)
 */
function renderRoomPart(buffers, texture, partName) {
  setupVertexAttribPointers(
    positionLocation, normalLocation, texcoordLocation,
    buffers.position, buffers.normal, buffers.texcoord, false
  );
  
  setObjectUniforms(texture, 0, 1, [1, 1, 1]);
  
  /* Room parts don't need transformation (already at origin) */
  let world = m4.identity();
  gl.uniformMatrix4fv(frameLocation, false, world);
  setNormalMatrix(world);
  
  gl.drawArrays(gl.TRIANGLES, 0, buffers.vertexCount);
}

/**
 * Renders a single part of a mesh object with material properties
 * Used for frames, statues, benches, etc.
 * @param {WebGLBuffer} positionBuf - Position vertex buffer
 * @param {WebGLBuffer} normalBuf - Normal vertex buffer
 * @param {WebGLBuffer} texcoordBuf - Texture coordinate vertex buffer
 * @param {WebGLTexture} texture - Texture to apply
 * @param {number} ignoreLight - 1 = unlit, 0 = lit
 * @param {number} useTexture - 1 = use texture, 0 = use color
 * @param {number[]} color - RGB color if not using texture
 * @param {mat4} world - Model-to-world transformation matrix
 * @param {number} numVerts - Number of vertices to render
 */
function renderMeshPart(positionBuf, normalBuf, texcoordBuf, texture, ignoreLight, useTexture, color, world, numVerts) {
  setupVertexAttribPointers(
    positionLocation, normalLocation, texcoordLocation,
    positionBuf, normalBuf, texcoordBuf, false
  );

  setObjectUniforms(texture, ignoreLight, useTexture, color);

  gl.uniformMatrix4fv(frameLocation, false, world);
  setNormalMatrix(world);

  gl.drawArrays(gl.TRIANGLES, 0, numVerts);
}

/**
 * Creates a transformation matrix from translation, rotation, and scale
 * Applies transformations in: rotation -> translation -> scale order
 * @param {number[]} translation - [x, y, z] position
 * @param {number[]} rotation - [x, y, z] rotation angles in radians (default [0,0,0])
 * @param {number[]} scale - [x, y, z] scale factors (default [1,1,1])
 * @returns {mat4} Combined transformation matrix
 */
function buildWorldMatrix(translation, rotation = [0,0,0], scale = [1,1,1]) {
  let world = m4.identity();
  world = m4.multiply(world, m4.xRotation(rotation[0]));
  world = m4.multiply(world, m4.yRotation(rotation[1]));
  world = m4.multiply(world, m4.zRotation(rotation[2]));
  world = m4.multiply(world, m4.translation(translation[0], translation[1], translation[2]));
  world = m4.multiply(world, m4.scaling(scale[0], scale[1], scale[2]));
  return world;
}

// --- Joystick (movimento, lato sinistro) ---
const joystickThumb = document.getElementById('joystick-thumb');
const joystickZone  = document.getElementById('joystick-zone');
const JOYSTICK_MAX  = 40; // raggio massimo in px

let joystickActive = false;
let joystickId     = null;
let joystickOrigin = { x: 0, y: 0 };
let joystickDelta  = { x: 0, y: 0 };

joystickZone.addEventListener('touchstart', e => {
  e.preventDefault();
  const t = e.changedTouches[0];
  joystickId = t.identifier;
  joystickActive = true;
  const rect = joystickZone.getBoundingClientRect();
  joystickOrigin = { x: rect.left + 70, y: rect.top + 70 };
}, { passive: false });

joystickZone.addEventListener('touchmove', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== joystickId) continue;
    let dx = t.clientX - joystickOrigin.x;
    let dy = t.clientY - joystickOrigin.y;
    const len = Math.sqrt(dx * dx + dy * dy);
    if (len > JOYSTICK_MAX) { dx = dx / len * JOYSTICK_MAX; dy = dy / len * JOYSTICK_MAX; }
    joystickDelta = { x: dx, y: dy };
    joystickThumb.style.transform = `translate(${dx}px, ${dy}px)`;
  }
}, { passive: false });

joystickZone.addEventListener('touchend', e => {
  e.preventDefault();
  for (const t of e.changedTouches) {
    if (t.identifier !== joystickId) continue;
    joystickActive = false;
    joystickId = null;
    joystickDelta = { x: 0, y: 0 };
    joystickThumb.style.transform = 'translate(0px, 0px)';
  }
}, { passive: false });

function applyJoystickMovement() {
  if (!joystickActive || sit) return;
  const spd = 0.08;
  const nx = joystickDelta.x / JOYSTICK_MAX;
  const ny = joystickDelta.y / JOYSTICK_MAX;
  const forward = [Math.sin(yaw), 0, -Math.cos(yaw)];
  const right   = [Math.cos(yaw), 0,  Math.sin(yaw)];
  camPos = camPos.map((v, i) => v - forward[i] * ny * spd + right[i] * nx * spd);
  camPos = camPos.map((v, i) => Math.min(Math.max(v, roomMin[i]), roomMax[i]));
}

/* NUOVO: 6 pass — una per ogni faccia della cubemap.
   lightIndex: indice in lights[], cubeTexture: cubemap da riempire, fbo: framebuffer associato */
function renderShadowMap(lightIndex, cubeTexture, fbo) {
    const lightPos = lights[lightIndex].position;
    const lightProj = m4.perspective(Math.PI / 2, 1.0, 0.1, SHADOW_FAR);

    /* Sei direzioni standard OpenGL per la cubemap */
    const cubeDirections = [
        { dir: [ 1, 0, 0], up: [0,-1, 0] }, // +X
        { dir: [-1, 0, 0], up: [0,-1, 0] }, // -X
        { dir: [ 0, 1, 0], up: [0, 0, 1] }, // +Y
        { dir: [ 0,-1, 0], up: [0, 0,-1] }, // -Y
        { dir: [ 0, 0, 1], up: [0,-1, 0] }, // +Z
        { dir: [ 0, 0,-1], up: [0,-1, 0] }, // -Z
    ];

    gl.useProgram(depthProgram);
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.viewport(0, 0, SHADOW_SIZE, SHADOW_SIZE);

    /* Uniform invarianti tra i 6 pass */
    gl.uniform3fv(depth_uLightPos, lightPos);
    gl.uniform1f(depth_uFarPlane, SHADOW_FAR);

    /* Pulisce ogni faccia al valore massimo (1.0 = distanza infinita = nessuna ombra per
       direzioni in cui non c'è geometria nella shadow pass) */
    gl.clearColor(1.0, 0.0, 0.0, 1.0);

    for (let face = 0; face < 6; face++) {
        /* Collega la faccia corrente della cubemap come color attachment */
        gl.framebufferTexture2D(
            gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0,
            gl.TEXTURE_CUBE_MAP_POSITIVE_X + face,
            cubeTexture, 0
        );
        gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

        /* Calcola la matrice vista dalla luce verso questa faccia */
        const d = cubeDirections[face];
        const target = [lightPos[0]+d.dir[0], lightPos[1]+d.dir[1], lightPos[2]+d.dir[2]];
        const lightView = m4.inverse(m4.lookAt(lightPos, target, d.up));
        const lightSpaceMatrix = m4.multiply(lightProj, lightView);
        gl.uniformMatrix4fv(depth_uLightSpace, false, lightSpaceMatrix);

        /* FLOOR */
        gl.bindBuffer(gl.ARRAY_BUFFER, floorBuf);
        gl.vertexAttribPointer(depth_posLoc, 3, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(depth_posLoc);
        gl.uniformMatrix4fv(depth_uModel, false, m4.identity());
        gl.drawArrays(gl.TRIANGLES, 0, floor.length / 3);

        /* BENCHES */
        benchPosition.forEach(el => {
            for (let i = 0; i < meshBench.part.length; i++) {
                gl.bindBuffer(gl.ARRAY_BUFFER, positionBufBench[i]);
                gl.vertexAttribPointer(depth_posLoc, 3, gl.FLOAT, false, 0, 0);
                gl.enableVertexAttribArray(depth_posLoc);
                gl.uniformMatrix4fv(depth_uModel, false,
                    m4.multiply(m4.translation(el[0], el[1], el[2]), m4.scaling(1.2, 1.2, 1.2)));
                gl.drawArrays(gl.TRIANGLES, 0, numVerticesBench[i]);
            }
        });

        /* STATUE */
        for (let i = 0; i < meshStatue.part.length; i++) {
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBufStatue[i]);
            gl.vertexAttribPointer(depth_posLoc, 3, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(depth_posLoc);
            gl.uniformMatrix4fv(depth_uModel, false,
                m4.multiply(m4.translation(0, 1.2, 5.4), m4.scaling(1.2, 1.2, 1.2)));
            gl.drawArrays(gl.TRIANGLES, 0, numVerticesStatue[i]);
        }

        /* FRAMES */
        frames.forEach(el => {
            for (let i = 0; i < meshFrame.part.length; i++) {
                gl.bindBuffer(gl.ARRAY_BUFFER, positionBufFrame[i]);
                gl.vertexAttribPointer(depth_posLoc, 3, gl.FLOAT, false, 0, 0);
                gl.enableVertexAttribArray(depth_posLoc);
                let worldFrame = m4.identity();
                worldFrame = m4.multiply(worldFrame, m4.xRotation(el.rotation[0]));
                worldFrame = m4.multiply(worldFrame, m4.yRotation(el.rotation[1]));
                worldFrame = m4.multiply(worldFrame, m4.zRotation(el.rotation[2]));
                worldFrame = m4.multiply(worldFrame, m4.translation(el.translation[0], el.translation[1], el.translation[2]));
                gl.uniformMatrix4fv(depth_uModel, false, worldFrame);
                gl.drawArrays(gl.TRIANGLES, 0, numVerticesFrame[i]);
            }
        });
    }

    /* Ripristina il framebuffer principale e il clearColor nero */
    gl.clearColor(0.0, 0.0, 0.0, 1.0);
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.viewport(0, 0, canvas.width, canvas.height);
}

    shadowCubeTexture = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_CUBE_MAP, shadowCubeTexture);
    for (let i = 0; i < 6; i++) {
        gl.texImage2D(gl.TEXTURE_CUBE_MAP_POSITIVE_X + i, 0, gl.R32F,
            newSize, newSize, 0, gl.RED, gl.FLOAT, null);
    }
    gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_R, gl.CLAMP_TO_EDGE);

    gl.bindRenderbuffer(gl.RENDERBUFFER, shadowDepthRBO);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, newSize, newSize);

    gl.deleteTexture(shadowCubeTexture1);
    shadowCubeTexture1 = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_CUBE_MAP, shadowCubeTexture1);
    for (let i = 0; i < 6; i++) {
        gl.texImage2D(gl.TEXTURE_CUBE_MAP_POSITIVE_X + i, 0, gl.R32F,
            newSize, newSize, 0, gl.RED, gl.FLOAT, null);
    }
    gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MIN_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_MAG_FILTER, gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_CUBE_MAP, gl.TEXTURE_WRAP_R, gl.CLAMP_TO_EDGE);

    gl.bindRenderbuffer(gl.RENDERBUFFER, shadowDepthRBO1);
    gl.renderbufferStorage(gl.RENDERBUFFER, gl.DEPTH_COMPONENT24, newSize, newSize);
}


/**
 * MAIN RENDERING FUNCTION: drawScene
 * Renders the entire scene: room, objects, lighting
 * This function is called every frame to draw everything visible
 * 
 * @param {WebGLProgram} program - The shader program to use for rendering
 * @param {boolean} isDepthPass - true if rendering for shadow map, false for normal rendering
 * 
 * Rendering sequence:
 * 1. Floor (wood texture)
 * 2. Ceiling (wood texture)
 * 3. Walls (white texture)
 * 4. Picture frames (5 different artworks)
 * 5. Statue (Diane sculpture)
 * 6. Benches (gallery seating)
 * 7. Captions/plaques (text overlays)
 */
function drawScene(program, isDepthPass = false) {
    gl.useProgram(program);

    /* Select position attribute location based on render pass */
    const posLoc = isDepthPass ? depth_posLoc : positionLocation;

    // ======================
    // RENDERING FLOOR
    // ======================
    /**
     * The floor is a simple rectangular plane at Y=0
     * Textured with wood grain pattern, repeated 4x4
     */
    gl.bindBuffer(gl.ARRAY_BUFFER, floorBuf);
    gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(posLoc);

    if (!isDepthPass) {
        /* Setup normal and texture for lighting and texturing */
        gl.bindBuffer(gl.ARRAY_BUFFER, floorNormBuf);
        gl.vertexAttribPointer(normalLocation, 3, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(normalLocation);

        gl.bindBuffer(gl.ARRAY_BUFFER, floorTexBuf);
        gl.vertexAttribPointer(texcoordLocation, 2, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(texcoordLocation);

        /* Bind floor texture */
        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, textureFloor);
        gl.uniform1i(textureLocation, 0);

        /* Floor is lit and textured */
        gl.uniform1i(u_ignoreLight, 0);      /* Apply lighting */
        gl.uniform1i(u_useTexture, 1);       /* Use texture */
        gl.uniform3fv(u_objectColor, [1, 1, 1]); /* White color multiplier */
    }

    /* Identity matrix: floor is not transformed */
    let world = m4.identity();
    gl.uniformMatrix4fv(frameLocation, false, world);
    if (!isDepthPass) {
      setNormalMatrix(world);
    }

    /* Draw floor: 6 vertices (2 triangles) */
    gl.drawArrays(gl.TRIANGLES, 0, floor.length / 3);

    // ======================
    // RENDERING CEILING
    // ======================
    /**
     * The ceiling is a rectangular plane at Y=height
     * Textured like the floor but with 2x2 repetition
     */
    gl.bindBuffer(gl.ARRAY_BUFFER, ceilBuf);
    gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(posLoc);

    if (!isDepthPass) {
        gl.bindBuffer(gl.ARRAY_BUFFER, ceilNormBuf);
        gl.vertexAttribPointer(normalLocation, 3, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(normalLocation);

        gl.bindBuffer(gl.ARRAY_BUFFER, ceilTexBuf);
        gl.vertexAttribPointer(texcoordLocation, 2, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(texcoordLocation);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, textureCeil);
        gl.uniform1i(textureLocation, 0);

        gl.uniform1i(u_ignoreLight, 0);
        gl.uniform1i(u_useTexture, 1);
        gl.uniform3fv(u_objectColor, [1, 1, 1]);
    }

    gl.drawArrays(gl.TRIANGLES, 0, ceil.length / 3);

    // ======================
    // RENDERING WALLS
    // ======================
    /**
     * Four walls of the room (North, South, East, West)
     * All walls use the same white texture
     */
    gl.bindBuffer(gl.ARRAY_BUFFER, wallsBuf);
    gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
    gl.enableVertexAttribArray(posLoc);

    if (!isDepthPass) {
        gl.bindBuffer(gl.ARRAY_BUFFER, wallNormBuf);
        gl.vertexAttribPointer(normalLocation, 3, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(normalLocation);

        gl.bindBuffer(gl.ARRAY_BUFFER, texturePosition);
        gl.vertexAttribPointer(texcoordLocation, 2, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(texcoordLocation);

        gl.activeTexture(gl.TEXTURE0);
        gl.bindTexture(gl.TEXTURE_2D, textureWall);
        gl.uniform1i(textureLocation, 0);

        gl.uniform1i(u_ignoreLight, 0);
        gl.uniform1i(u_useTexture, 1);
        gl.uniform3fv(u_objectColor, [1, 1, 1]);
    }

    gl.drawArrays(gl.TRIANGLES, 0, wallCount);

    // ======================
    // RENDERING PICTURE FRAMES
    // ======================
    /**
     * Each frame is a 3D model with multiple parts
     * Positioned on walls, each has a different artwork texture
     * Multiple frames allow gallery-like display
     */
    frames.forEach(el => {
        for (let i = 0; i < meshFrame.part.length; i++) {
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBufFrame[i]);
            gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(posLoc);

            if (!isDepthPass) {
                gl.bindBuffer(gl.ARRAY_BUFFER, normalBufFrame[i]);
                gl.vertexAttribPointer(normalLocation, 3, gl.FLOAT, false, 0, 0);
                gl.enableVertexAttribArray(normalLocation);

                gl.bindBuffer(gl.ARRAY_BUFFER, texcoordBufFrame[i]);
                gl.vertexAttribPointer(texcoordLocation, 2, gl.FLOAT, false, 0, 0);
                gl.enableVertexAttribArray(texcoordLocation);

                /* Select texture for this frame's artwork */
                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, textureFrame[el.textureIndex]);
                gl.uniform1i(textureLocation, 0);

                gl.uniform1i(u_ignoreLight, 0);
                gl.uniform1i(u_useTexture, i);  /* Part 0 is frame, part 1 is canvas */
                gl.uniform3fv(u_objectColor, [1, 1, 1]);
            }

            /* Build transformation: rotation -> translation */
            let worldFrame = m4.identity();
            worldFrame = m4.multiply(worldFrame, m4.xRotation(el.rotation[0]));
            worldFrame = m4.multiply(worldFrame, m4.yRotation(el.rotation[1]));
            worldFrame = m4.multiply(worldFrame, m4.zRotation(el.rotation[2]));
            worldFrame = m4.multiply(worldFrame, m4.translation(el.translation[0], el.translation[1], el.translation[2]));
            
            gl.uniformMatrix4fv(frameLocation, false, worldFrame);
            if (!isDepthPass) {
              setNormalMatrix(worldFrame);
            }

            gl.drawArrays(gl.TRIANGLES, 0, numVerticesFrame[i]);
        }
    });

    // ======================
    // RENDERING STATUE
    // ======================
    /**
     * The Diane sculpture: a high-polygon 3D model
     * Centered in the gallery, scaled up for prominence
     * Lit with specular highlights for marble effect
     */
    for (let i = 0; i < meshStatue.part.length; i++) {
        gl.bindBuffer(gl.ARRAY_BUFFER, positionBufStatue[i]);
        gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
        gl.enableVertexAttribArray(posLoc);

        if (!isDepthPass) {
            gl.bindBuffer(gl.ARRAY_BUFFER, normalBufStatue[i]);
            gl.vertexAttribPointer(normalLocation, 3, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(normalLocation);

            gl.bindBuffer(gl.ARRAY_BUFFER, texcoordBufStatue[i]);
            gl.vertexAttribPointer(texcoordLocation, 2, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(texcoordLocation);

            gl.activeTexture(gl.TEXTURE0);
            gl.bindTexture(gl.TEXTURE_2D, textureStatue);
            gl.uniform1i(textureLocation, 0);

            gl.uniform1i(u_ignoreLight, 0);
            gl.uniform1i(u_useTexture, 1);  /* Textured with marble texture */
            gl.uniform3fv(u_objectColor, [0, 0, 0]);
        }

        /* Transform: translate to position and scale up */
        let worldStatue = m4.identity();
        worldStatue = m4.multiply(worldStatue, m4.translation(0, 1.2, 5.4));
        worldStatue = m4.multiply(worldStatue, m4.scaling(1.2, 1.2, 1.2));
        gl.uniformMatrix4fv(frameLocation, false, worldStatue);
        if (!isDepthPass) {
          setNormalMatrix(worldStatue);
        }

        gl.drawArrays(gl.TRIANGLES, 0, numVerticesStatue[i]);
    }

    // ======================
    // RENDERING BENCHES
    // ======================
    /**
     * Benches: 3D models of gallery seating
     * Player can sit on benches using E key
     * Textured with wood/metallic material
     */
    benchPosition.forEach(el => {
        for (let i = 0; i < meshBench.part.length; i++) {
            gl.bindBuffer(gl.ARRAY_BUFFER, positionBufBench[i]);
            gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);
            gl.enableVertexAttribArray(posLoc);

            if (!isDepthPass) {
                gl.bindBuffer(gl.ARRAY_BUFFER, normalBufBench[i]);
                gl.vertexAttribPointer(normalLocation, 3, gl.FLOAT, false, 0, 0);
                gl.enableVertexAttribArray(normalLocation);

                gl.bindBuffer(gl.ARRAY_BUFFER, texcoordBufBench[i]);
                gl.vertexAttribPointer(texcoordLocation, 2, gl.FLOAT, false, 0, 0);
                gl.enableVertexAttribArray(texcoordLocation);

                gl.activeTexture(gl.TEXTURE0);
                gl.bindTexture(gl.TEXTURE_2D, textureBench);
                gl.uniform1i(textureLocation, 0);

                gl.uniform1i(u_ignoreLight, 0);
                gl.uniform1i(u_useTexture, 1);
                gl.uniform3fv(u_objectColor, [0, 0, 0]);
            }

            /* Transform: translate to position and scale */
            let worldBench = m4.identity();
            worldBench = m4.multiply(worldBench, m4.translation(el[0], el[1], el[2]));
            worldBench = m4.multiply(worldBench, m4.scaling(1.2, 1.2, 1.2));
            gl.uniformMatrix4fv(frameLocation, false, worldBench);
            if (!isDepthPass) {
              setNormalMatrix(worldBench);
            }

            gl.drawArrays(gl.TRIANGLES, 0, numVerticesBench[i]);
        }
    });

    // ======================
    // RENDERING CAPTIONS/PLAQUES
    // ======================
    /**
     * 2D text plaques displayed below artworks
     * Shows artwork titles and artist names
     * Rendered as textured quads with pre-rendered text
     */
     if (!isDepthPass) {
      caption.forEach(cap => {
          /* Create plane and text texture for this caption */

          const { plane, texture } = captionPlanes[cap.index];

          /* Setup vertex attributes for text quad */
          gl.bindBuffer(gl.ARRAY_BUFFER, plane.position);
          gl.enableVertexAttribArray(posLoc);
          gl.vertexAttribPointer(posLoc, 3, gl.FLOAT, false, 0, 0);

          gl.bindBuffer(gl.ARRAY_BUFFER, plane.normal);
          gl.enableVertexAttribArray(normalLocation);
          gl.vertexAttribPointer(normalLocation, 3, gl.FLOAT, false, 0, 0);

          /* Texture coordinates for text quad */
          gl.bindBuffer(gl.ARRAY_BUFFER, plane.texcoord);
          gl.enableVertexAttribArray(texcoordLocation);
          gl.vertexAttribPointer(texcoordLocation, 2, gl.FLOAT, false, 0, 0);

          /* Bind text texture */
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, texture);
          gl.uniform1i(textureLocation, 0);

          gl.uniform1i(u_useTexture, 1);
          gl.uniform1i(u_ignoreLight, 0);  /* Apply some lighting to captions */
          gl.uniform3fv(u_objectColor, [1,1,1]);

          /* Build transformation matrix for text plaque */
          let matrix = m4.identity();
          matrix = m4.multiply(matrix, m4.translation(cap.translation[0], cap.translation[1], cap.translation[2]));
          matrix = m4.multiply(matrix, m4.xRotation(cap.rotation[0]))
          matrix = m4.multiply(matrix, m4.yRotation(cap.rotation[1]));
          matrix = m4.multiply(matrix, m4.zRotation(cap.rotation[2]));
          matrix = m4.multiply(matrix, m4.scaling(0.7,0.35,0.35));  /* Flatten: 0.35 = paper-thin */

          gl.uniformMatrix4fv(frameLocation, false, matrix);
          setNormalMatrix(matrix);
          
          /* Draw the text plaque (triangle strip for efficiency) */
          gl.drawArrays(gl.TRIANGLE_STRIP, 0, plane.numVertices);
      })
    }
}


// ==================== SETTINGS MENU (dat.GUI) ====================

const qualitySizes = { 'Bassa': 512, 'Normale': 1024, 'Alta': 2048, 'Ottima': 4096 };

const guiParams = {
    shadows: true,
    shadowQuality: 'Bassa',
    salva: function() {
        shadowsEnabled = guiParams.shadows;
        const newSize = qualitySizes[guiParams.shadowQuality];
        if (newSize !== SHADOW_SIZE) recreateShadowResources(newSize);
        menuOpen = false;
        gui.domElement.style.display = 'none';
    }
};

gui = new dat.GUI({ name: 'Impostazioni' });
const shadowsCtrl  = gui.add(guiParams, 'shadows').name('Mostra ombre');
const qualityCtrl  = gui.add(guiParams, 'shadowQuality', Object.keys(qualitySizes)).name('Qualità ombre');
gui.add(guiParams, 'salva').name('Salva impostazioni');

shadowsCtrl.onChange(val => {
    qualityCtrl.__li.style.display = val ? '' : 'none';
});

gui.domElement.style.display = 'none';


/**
 * MAIN ANIMATION FRAME
 * This function is called 60 times per second (60 FPS)
 * Updates camera and renders the scene each frame
 */
function draw() {
  /* Clear the canvas: set background color to black */
  gl.clearColor(0,0,0,1);
  /* Clear both color and depth buffers for fresh frame */
  gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

  applyJoystickMovement();

  // [OLD - 2D shadow map] const lightSpaceMatrix = computeShadowMatrix();
  // [OLD - 2D shadow map] renderShadowMap(lightSpaceMatrix);
  if (shadowsEnabled) {
    renderShadowMap(0, shadowCubeTexture,  shadowFBO);   /* luce 0 */
    renderShadowMap(1, shadowCubeTexture1, shadowFBO1);  /* luce 1 */
  }

  /* Use the main object rendering program */
  gl.useProgram(progObj);

  /* ===== UPDATE CAMERA POSITION ===== */
  /**
   * Compute camera look direction:
   * Yaw angle determines where the camera faces on the horizontal plane
   * The camera always looks forward from its position
   */
  const center = [
    camPos[0] + Math.sin(yaw),    /* Look-at point: offset in XZ based on yaw */
    camPos[1],                     /* Look height: same as camera */
    camPos[2] - Math.cos(yaw)
  ];

  /* ===== COMPUTE VIEW MATRIX ===== */
  /**
   * Camera matrix: describes where camera is and which direction it faces
   * View matrix: inverse of camera matrix (transforms world to camera space)
   */
  var cameraMatrix = m4.lookAt(camPos, center, [0, 1, 0]);  /* Y-up world */
  var viewMatrix = m4.inverse(cameraMatrix);

  /* ===== SEND COMMON UNIFORMS TO SHADER ===== */
  /**
   * These uniforms are the same for all objects in this frame
   */
  gl.uniformMatrix4fv(viewMatrixLocation, false, viewMatrix);           /* View matrix */
  gl.uniformMatrix4fv(projectionMatrixLocation, false, proj);           /* Projection matrix */
  gl.uniform3fv(u_viewPosLocation, camPos);                             /* Camera position for specular */

  /* ===== SEND LIGHT DATA TO SHADER ===== */
  /**
   * Send each light source's position, color, and intensity to the shader
   * Shader uses this to calculate lighting for all objects
   */
  lights.forEach((l,i)=>{
          gl.uniform3fv(u_lights_position[i], l.position);     /* Light position */
          gl.uniform3fv(u_lights_color[i], l.color);           /* Light color */
          gl.uniform1f(u_lights_intensity[i], l.intensity);    /* Light intensity */
  });

  /* [OLD - 2D shadow map]
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_2D, shadowDepthTexture);
  gl.uniform1i(u_shadowMapLocation, 1);
  gl.uniformMatrix4fv(u_lightSpaceMatrixLocation, false, lightSpaceMatrix);
  */

  /* NUOVO: lega le cubemap alle unità di texture 1 e 2 */
  gl.activeTexture(gl.TEXTURE1);
  gl.bindTexture(gl.TEXTURE_CUBE_MAP, shadowCubeTexture);
  gl.uniform1i(u_shadowCubeLocation, 1);

  gl.activeTexture(gl.TEXTURE2);
  gl.bindTexture(gl.TEXTURE_CUBE_MAP, shadowCubeTexture1);
  gl.uniform1i(u_shadowCube1Location, 2);

  gl.uniform1f(u_farPlaneLocation, SHADOW_FAR);
  gl.uniform1i(u_useShadowsLocation, shadowsEnabled ? 1 : 0);

  /* ===== RENDER THE SCENE ===== */
  /**
   * Call drawScene to render all objects with current camera and lighting
   * isDepthPass=false: normal rendering (not for shadow maps)
   */
  drawScene(progObj, false); 

  /* ===== REQUEST NEXT FRAME ===== */
  /**
   * Schedule this function to run again at next browser animation frame
   * Creates the animation loop (60 FPS on most monitors)
   */
  requestAnimationFrame(draw);
}

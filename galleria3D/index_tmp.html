<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Stanza WebGL pura</title>
<style>
  html, body { margin:0; height:100%; background:#000; overflow:hidden; }
  canvas { display:block; }
  #info {
    position: fixed; left: 10px; bottom: 10px;
    background: rgba(0,0,0,0.5); color: white; padding: 8px;
    font-family: sans-serif; font-size: 14px; border-radius: 6px;
  }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<div id="info">W/A/S/D: muovi · Mouse: guarda (clicca sul canvas) · ESC: esci</div>
<script>
// ---- Setup WebGL ----
const canvas = document.getElementById("glcanvas");
const gl = canvas.getContext("webgl");
if (!gl) { alert("WebGL non supportato"); }

function resize() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  gl.viewport(0,0,canvas.width,canvas.height);
}
window.addEventListener("resize", resize);
resize();

// ---- Shaders ----
const vsSource = `
attribute vec3 aPosition;
uniform mat4 uMVP;
void main(void) {
  gl_Position = uMVP * vec4(aPosition, 1.0);
}`;
const fsSource = `
precision mediump float;
uniform vec3 uColor;
void main(void) {
  gl_FragColor = vec4(uColor, 1.0);
}`;

// Compilazione shader
function compileShader(src, type) {
  const s = gl.createShader(type);
  gl.shaderSource(s, src);
  gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
    console.error(gl.getShaderInfoLog(s));
    return null;
  }
  return s;
}
const vs = compileShader(vsSource, gl.VERTEX_SHADER);
const fs = compileShader(fsSource, gl.FRAGMENT_SHADER);

// Programma
const program = gl.createProgram();
gl.attachShader(program, vs);
gl.attachShader(program, fs);
gl.linkProgram(program);
if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
  console.error(gl.getProgramInfoLog(program));
}
gl.useProgram(program);

// ---- Geometria stanza ----
const roomSize = 20;
const h = roomSize / 2;
const verts = [
// Pavimento (nero)
 -h, 0, -h,   h, 0, -h,   h, 0,  h,
 -h, 0, -h,   h, 0,  h,  -h, 0,  h,
// Soffitto (bianco)
 -h, roomSize, -h,   h, roomSize,  h,   h, roomSize, -h,
 -h, roomSize, -h,  -h, roomSize,  h,   h, roomSize,  h,
// Muro nord
 -h, 0, h,   h, roomSize, h,   h, 0, h,
 -h, 0, h,  -h, roomSize, h,   h, roomSize, h,
// Muro sud
 -h, 0, -h,   h, 0, -h,   h, roomSize, -h,
 -h, 0, -h,  -h, roomSize, -h,  h, roomSize, -h,
// Muro est
 h, 0, -h,   h, 0, h,   h, roomSize, h,
 h, 0, -h,   h, roomSize, h,   h, roomSize, -h,
// Muro ovest
 -h, 0, -h,  -h, roomSize, h,  -h, 0, h,
 -h, 0, -h,  -h, roomSize, -h, -h, roomSize, h
];
const vertexBuffer = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, vertexBuffer);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(verts), gl.STATIC_DRAW);

const aPosition = gl.getAttribLocation(program, "aPosition");
gl.enableVertexAttribArray(aPosition);
gl.vertexAttribPointer(aPosition, 3, gl.FLOAT, false, 0, 0);

const uMVP = gl.getUniformLocation(program, "uMVP");
const uColor = gl.getUniformLocation(program, "uColor");

// ---- Matrici ----
function perspective(fov, aspect, near, far) {
  const f = 1.0 / Math.tan(fov / 2);
  return [
    f/aspect,0,0,0,
    0,f,0,0,
    0,0,(far+near)/(near-far),-1,
    0,0,(2*far*near)/(near-far),0
  ];
}
function multiply(a,b) {
  const out = new Array(16);
  for (let i=0;i<4;i++) {
    for (let j=0;j<4;j++) {
      out[i*4+j] = a[i*4+0]*b[0*4+j] +
                   a[i*4+1]*b[1*4+j] +
                   a[i*4+2]*b[2*4+j] +
                   a[i*4+3]*b[3*4+j];
    }
  }
  return out;
}
function lookAt(eye, center, up) {
  const z = normalize(sub(eye, center));
  const x = normalize(cross(up, z));
  const y = cross(z, x);
  return [
    x[0], y[0], z[0], 0,
    x[1], y[1], z[1], 0,
    x[2], y[2], z[2], 0,
    -dot(x, eye), -dot(y, eye), -dot(z, eye), 1
  ];
}
function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}
function normalize(v){const l=Math.hypot(...v);return [v[0]/l,v[1]/l,v[2]/l];}
function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}

// ---- Controlli ----
let pos = [0, 1.6, 0];
let yaw = 0;
let pitch = 0;
const keys = {};
window.addEventListener("keydown", e=>keys[e.code]=true);
window.addEventListener("keyup", e=>keys[e.code]=false);

canvas.addEventListener("click", ()=>canvas.requestPointerLock());
document.addEventListener("mousemove", e=>{
  if (document.pointerLockElement===canvas) {
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-Math.PI/2, Math.min(Math.PI/2, pitch));
  }
});

// ---- Loop ----
function loop() {
  const speed = 0.05;
  const forward = [Math.sin(yaw), 0, Math.cos(yaw)];
  const right = [Math.cos(yaw), 0, -Math.sin(yaw)];
  if (keys["KeyW"]||keys["ArrowUp"]) {
    pos[0] += forward[0]*speed; pos[2] += forward[2]*speed;
  }
  if (keys["KeyS"]||keys["ArrowDown"]) {
    pos[0] -= forward[0]*speed; pos[2] -= forward[2]*speed;
  }
  if (keys["KeyA"]||keys["ArrowLeft"]) {
    pos[0] -= right[0]*speed; pos[2] -= right[2]*speed;
  }
  if (keys["KeyD"]||keys["ArrowRight"]) {
    pos[0] += right[0]*speed; pos[2] += right[2]*speed;
  }

  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0,0,0,1);
  gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);

  const aspect = canvas.width/canvas.height;
  const proj = perspective(Math.PI/3, aspect, 0.1, 100);
  const cx = pos[0] + Math.sin(yaw)*Math.cos(pitch);
  const cy = pos[1] + Math.sin(pitch);
  const cz = pos[2] + Math.cos(yaw)*Math.cos(pitch);
  const view = lookAt(pos, [cx, cy, cz], [0,1,0]);
  const mvp = multiply(proj, view);

  // Disegna pavimento nero
  gl.uniform3f(uColor, 0,0,0);
  gl.uniformMatrix4fv(uMVP, false, new Float32Array(mvp));
  gl.drawArrays(gl.TRIANGLES, 0, 6);

  // Disegna tutto il resto (muri + soffitto) in bianco
  gl.uniform3f(uColor, 1,1,1);
  gl.drawArrays(gl.TRIANGLES, 6, (verts.length/3)-6);

  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>

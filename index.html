<!DOCTYPE html>
<!-- 
  ====================================================================
  APPLICAZIONE WEBGL - GALLERIA 3D INTERATTIVA
  ====================================================================
  Questo è un ambiente 3D interattivo basato su WebGL che simula una
  visita all'interno di una galleria d'arte. Funzionalità principali:
  - Navigazione con telecamera in prima persona (WASD per muoversi, frecce per ruotare)
  - Panchine interattive su cui ci si può sedere (tasto E)
  - Stanza texturizzata con pavimento, pareti e soffitto
  - Quadri incorniciati appesi alle pareti
  - Una statua di marmo al centro della stanza
  - Illuminazione dinamica e didascalie testuali
  - Illuminazione basata su modello fisico con riflessi speculari

  Tecnologie utilizzate:
  - WebGL 2.0 per il rendering 3D
  - Shader GLSL ES per la grafica
  - Libreria di matematica matriciale (m4.js) per le trasformazioni
  - Loader di file OBJ per i dati delle mesh
  ====================================================================
-->

<html>
<body>
<!-- Canvas WebGL: superficie principale di rendering della scena 3D (1200x600px, rapporto 16:9) -->
<canvas id="gl" height="600" width="1200"></canvas>
<div id="loading">
  <div id="loading-text">Loading...</div>
</div>
<!-- Div notifica: mostra messaggi temporanei all'utente (es. "Non puoi sederti qui") -->
<div id="notification"></div>

<!-- Legenda comandi: pannello fisso in alto a sinistra con le istruzioni di movimento (solo desktop) -->
<div id="controls-legend">
  <div><strong>WASD</strong> &ndash; Muoviti</div>
  <div><strong>Frecce / Mouse</strong> &ndash; Guarda intorno</div>
  <div><strong>E</strong> &ndash; Siediti / Alzati</div>
</div>

<!-- Overlay controlli touch: visibile solo sui dispositivi touch -->
<div id="touch-controls">
  <div id="joystick-zone">
    <div id="joystick-base"></div>
    <div id="joystick-thumb"></div>
  </div>
  <div id="look-zone"></div>
  <div id="interact-btn">E</div>
  <div id="menu-btn">⚙</div>
</div>

<!-- ===== PROGRAMMI SHADER ===== -->
<!-- 
  VERTEX SHADER PER GLI OGGETTI 3D
  Elabora ogni vertice delle mesh (cornici, statua, panchine, ecc.)
  Compiti principali:
  - Trasformare la posizione del vertice dallo spazio modello allo spazio di clip
  - Calcolare i vettori normali per i calcoli di illuminazione
  - Passare le coordinate texture al fragment shader
-->
<script id="vertex-shader-obj" type="x-shader/x-vertex">#version 300 es
precision highp float;

// ===== ATTRIBUTI DI INPUT DEL VERTICE =====
in vec3 a_position;   /* Posizione 3D del vertice nello spazio modello */
in vec3 a_normal;     /* Vettore normale per i calcoli di illuminazione */
in vec2 a_texcoord;   /* Coordinate texture 2D (mapping UV) */

// ===== UNIFORM (uguali per tutti i vertici in una singola draw call) =====
uniform mat4 u_world;      /* Matrice di trasformazione da spazio modello a spazio mondo */
uniform mat4 u_view;       /* Matrice di trasformazione da spazio mondo a spazio vista */
uniform mat4 u_proj;       /* Matrice di proiezione da spazio vista a spazio di clip */
uniform mat3 u_normalMatrix; /* Trasforma le normali nello spazio mondo (inversa trasposta di u_world) */

// ===== OUTPUT VERSO IL FRAGMENT SHADER =====
out vec3 v_normal;     /* Vettore normale nello spazio mondo */
out vec3 v_position;   /* Posizione del vertice nello spazio mondo */
out vec2 v_texcoord;   /* Coordinate texture passate al fragment shader */

void main() {
    /* Trasforma la normale nello spazio mondo per l'illuminazione per-frammento */
    v_normal = normalize(u_normalMatrix * a_normal);
    /* Passa le coordinate texture invariate */
    v_texcoord = a_texcoord;

    /* Trasforma la posizione del vertice nello spazio mondo e la salva per l'illuminazione */
    vec4 worldPos = u_world * vec4(a_position, 1.0);
    v_position = worldPos.xyz;

    /* Trasformazione finale: spazio modello -> mondo -> vista -> clip */
    gl_Position = u_proj * u_view * worldPos;
}
</script>
<!-- 
  FRAGMENT SHADER PER GLI OGGETTI 3D
  Calcola il colore finale di ogni pixel utilizzando:
  - Modello di illuminazione di Phong (diffusa + speculare + ambientale)
  - Mappatura di texture opzionale
  - Più sorgenti di luce con attenuazione in base alla distanza
-->
<script id="fragment-shader-obj" type="x-shader/x-fragment">#version 300 es
precision mediump float;

/* Numero massimo di sorgenti di luce supportate */
#define NUM_LIGHTS 2

/* Struttura dati di una sorgente di luce */
struct Light {
    vec3 position;   /* Posizione della luce nello spazio mondo */
    vec3 color;      /* Colore RGB della luce */
    float intensity; /* Moltiplicatore di intensità luminosa */
};

// ===== UNIFORM DI INPUT =====
uniform Light u_lights[NUM_LIGHTS];     /* Array delle sorgenti di luce */
uniform vec3 u_viewPos;                 /* Posizione della telecamera nello spazio mondo */
uniform vec3 u_objectColor;             /* Colore base dell'oggetto */
uniform int u_ignoreLight;              /* Flag: 0 = applica l'illuminazione, 1 = oggetto non illuminato */
uniform sampler2D u_texture;            /* Sampler per la mappatura texture 2D */
uniform bool u_useTexture;   /* Flag: true = usa la texture, false = usa il colore solido */

/* NUOVO: cubemap per ombre omnidirezionali (una per luce) */
uniform samplerCube u_shadowCube;
uniform samplerCube u_shadowCube1;
uniform float u_farPlane;
uniform bool u_useShadows;

// ===== INPUT DAL VERTEX SHADER =====
in vec3 v_normal;     /* Vettore normale in questo frammento */
in vec3 v_position;   /* Posizione di questo frammento nello spazio mondo */
in vec2 v_texcoord;   /* Coordinate texture di questo frammento */

// ===== OUTPUT =====
out vec4 fragColor;   /* Colore RGBA finale di questo pixel */

/* Single sample — campiona la cubemap corrispondente all'indice luce */
float shadowCalculation(int lightIndex) {
    if (!u_useShadows) return 0.0;
    vec3 fragToLight;
    float closestDepth;
    if (lightIndex == 0) {
        fragToLight  = v_position - u_lights[0].position;
        closestDepth = texture(u_shadowCube,  fragToLight).r * u_farPlane;
    } else {
        fragToLight  = v_position - u_lights[1].position;
        closestDepth = texture(u_shadowCube1, fragToLight).r * u_farPlane;
    }
    float currentDepth = length(fragToLight);
    float bias = 0.02;
    return currentDepth - bias > closestDepth ? 1.0 : 0.0;
}

void main() {
    /* Determina il colore base: dalla texture oppure dal colore solido dell'oggetto */
    vec3 baseColor = u_useTexture ? texture(u_texture, v_texcoord).rgb : u_objectColor;

    /* Se l'illuminazione è disabilitata, restituisce semplicemente il colore base */
    if (u_ignoreLight == 1) {
        fragColor = vec4(baseColor, 1.0);
        return;
    }

    /* ===== CALCOLO ILLUMINAZIONE DI PHONG ===== */
    vec3 norm = normalize(v_normal);                    /* Normalizza la normale della superficie */
    vec3 viewDir = normalize(u_viewPos - v_position);  /* Direzione dalla superficie alla telecamera */
    vec3 result = vec3(0.0);                            /* Accumulatore per l'illuminazione finale */

        for (int i = 0; i < NUM_LIGHTS; i++) {
        vec3 lightDir = normalize(u_lights[i].position - v_position);
        float diff = max(dot(norm, lightDir), 0.0);
        vec3 reflectDir = reflect(-lightDir, norm);
        float spec = pow(max(dot(viewDir, reflectDir), 0.0), 32.0);
        float distance = length(u_lights[i].position - v_position);
        float attenuation = 1.0 / (1.0 + 0.14 * distance + 0.07 * distance * distance);
        float specStrength = 0.3;

        vec3 diffuse  = diff * u_lights[i].color * u_lights[i].intensity * attenuation;
        vec3 specular = specStrength * spec * u_lights[i].color * u_lights[i].intensity * attenuation;

        /* NUOVO: moltiplica diffuse e specular per (1 - shadow) */
        float shadow = shadowCalculation(i);
        result += (1.0 - shadow) * (diffuse + specular);
    }

    /* Moltiplica l'illuminazione per il colore base (shading dipendente dal colore) */
    result *= baseColor;

    /* Aggiunge la luce ambientale: illuminazione minima ovunque (le ombre non sono nere pure) */
    result += 0.10 * baseColor;

    fragColor = vec4(result, 1.0);
}
</script>
<!-- 
  VERTEX SHADER PER IL RENDERING DI PROFONDITÀ/OMBRE
  Usato per renderizzare la profondità dal punto di vista della luce,
  necessario per generare la shadow map a cubemap
-->
<script id="vertex-shader-light" type="x-shader/x-vertex">#version 300 es
layout (location=0) in vec3 a_position;

uniform mat4 u_lightSpaceMatrix;
uniform mat4 u_model;

/* NUOVO: posizione world-space necessaria per calcolare la distanza nel fragment shader */
out vec3 v_fragPos;

void main(){
  vec4 worldPos = u_model * vec4(a_position, 1.0);
  v_fragPos = worldPos.xyz;
  gl_Position = u_lightSpaceMatrix * worldPos;
}
</script>

<!-- 
  FRAGMENT SHADER PER IL RENDERING DI PROFONDITÀ/OMBRE
  Calcola la distanza normalizzata tra il frammento e la luce e la
  scrive nel canale rosso della cubemap, usata come shadow map
-->
<script id="fragment-shader-light" type="x-shader/x-fragment">#version 300 es
precision highp float;

/* NUOVO: riceve la posizione world-space dal vertex shader */
in vec3 v_fragPos;
uniform vec3 u_lightPos;
uniform float u_farPlane;

/* Scrive la distanza normalizzata nel canale rosso della cubemap */
out vec4 fragColor;

void main() {
    float lightDistance = length(v_fragPos - u_lightPos) / u_farPlane;
    fragColor = vec4(lightDistance, 0.0, 0.0, 1.0);
}
</script>
